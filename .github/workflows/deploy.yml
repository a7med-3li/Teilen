name: deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEILEN_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/teilen
            git pull origin main
            docker compose pull
            docker compose up --build -d
