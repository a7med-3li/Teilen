<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#323232">
    <title>Teilen</title>
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Teilen</h1>
    <div class="head-right">
        <div id="status" class="status offline">connecting…</div>
        <button id="account" class="ghost" type="button" hidden aria-expanded="false">…</button>
    </div>
</header>

<!-- no token yet: nothing here is reachable without a paired device -->
<section id="pair" hidden>
    <div class="panel">
        <h2>Pair this browser</h2>
        <p class="panel-lead">Open Teilen on your phone and point its camera at this code.</p>

        <img id="qr" class="qr" alt="Pairing code as a QR code" width="228" height="228">

        <p id="pair-code" class="pair-code">····-····</p>
        <p id="pair-state" class="panel-lead">waiting for approval…</p>

        <button id="pair-retry" type="button" hidden>get a new code</button>
    </div>
</section>

<!-- the account menu: who is signed in, what else is paired, how to add or drop one -->
<section id="devices" hidden>
    <div class="panel">
        <h2>Paired devices</h2>
        <p id="account-phone" class="panel-lead"></p>
        <ul id="device-list" class="devices"></ul>

        <form id="approve-form" autocomplete="off">
            <label for="approve-code">Pair another phone — type the code it shows</label>
            <div class="row">
                <input id="approve-code" type="text" placeholder="ABCD-EFGH" maxlength="9"
                       autocapitalize="characters" spellcheck="false">
                <button type="submit">pair it</button>
            </div>
        </form>
        <p id="device-status" class="panel-lead" hidden></p>

        <button id="sign-out" class="danger" type="button">sign out of this browser</button>
    </div>
</section>

<main id="app" hidden>
    <form id="compose" autocomplete="off">
        <input id="compose-input" type="text" placeholder="paste anything and hit enter (handy for testing)" maxlength="20000">
        <button type="submit">send</button>
    </form>

    <form id="upload" autocomplete="off">
        <label class="file-field" for="upload-input">
            <input id="upload-input" type="file" multiple>
            <span id="upload-label">Attach files…</span>
        </label>
        <select id="upload-ttl" title="How long the files should live">
            <option value="300">5 min</option>
            <option value="900">15 min</option>
            <option value="1800" selected>30 min</option>
            <option value="3600">1 hour</option>
            <option value="14400">4 hours</option>
        </select>
        <button id="upload-send" type="submit" hidden>send</button>
    </form>

    <p id="upload-status" class="upload-status" hidden></p>

    <p id="empty" class="empty" hidden>Nothing here yet — share something from your phone.</p>
    <ul id="feed"></ul>
</main>

<footer id="foot" hidden>
    <span id="count">0 items</span>
    <button id="clear" type="button" hidden>delete all</button>
</footer>

<!-- shown while a file is dragged over the page: a whole-window drop target -->
<div id="drop-veil" hidden><span>Drop to send</span></div>

<!-- libsodium first (it defines window.libsodium), then its wrappers (window.sodium) -->
<script src="vendor/libsodium-sumo.js"></script>
<script src="vendor/libsodium-wrappers.js"></script>
<script src="cryptoStore.js"></script>
<script src="lan.js"></script>
<script src="app.js"></script>
</body>
</html>
