spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teilen}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # a little headroom over the blob cap for the multipart envelope itself
      max-file-size: 31MB
      max-request-size: 33MB
      # spool to disk straight away: an upload is a file, not an in-memory string
      file-size-threshold: 0

server:
  # 8080 is often taken on a dev machine; override with PORT=...
  port: ${PORT:8081}
  error:
    include-message: always

logging:
  level:
    com.backend: DEBUG

teilen:
  auth:
    # how long a pairing request stays answerable, and how often the waiting side should ask
    pairing-ttl-seconds: 300
    poll-interval-seconds: 3
    sweep-interval-ms: 60000
    # blob bytes are reachable by a signed link, because an <img> cannot carry a bearer token.
    # With no secret the key is random per start, so old links stop working after a restart.
    blob-link-secret: ${TEILEN_BLOB_LINK_SECRET:}
    blob-link-ttl-seconds: 900

  # how often expired rows are swept away
  reap-interval-ms: 5000
  default-ttl-seconds: 1800
  min-ttl-seconds: 10
  max-ttl-seconds: 86400
  # "keep it longer": what one tap of extend buys, capped by max-ttl-seconds
  extend-ttl-seconds: 3600
  # the plan's ephemerality invariant, applied to the /api/v1 relay surface: nothing registered
  # there may outlive this, whatever the client asks for
  relay-max-ttl-seconds: 600
  max-content-length: 20000
  # origins allowed to call the API / open the websocket
  allowed-origin-patterns: "*"

  # Web Push (zero-content arrival signal). With no VAPID key pair configured the whole pipeline
  # stays silent and the browser never subscribes — nothing else changes. Mint a pair with:
  #   openssl ecparam -genkey -name prime256v1 -noout -out vapid.pem
  # and take the public/private as base64url (the push service requires the uncompressed public key).
  push:
    vapid-public-key: ${TEILEN_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${TEILEN_VAPID_PRIVATE_KEY:}
    subject: ${TEILEN_VAPID_SUBJECT:mailto:admin@teilen.app}

  # shared files live here; wiped item by item when the TTL runs out
  storage-dir: ./data/blobs
  # 30 MB, counted while writing rather than trusted from a header
  max-blob-bytes: 31457280
