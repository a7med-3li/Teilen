services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teilen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teilen"]
      interval: 5s
      retries: 10

  app:
    image: ghcr.io/a7med-3li/teilen:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 8081
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: teilen
      DB_USER: teilen
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TEILEN_BLOB_LINK_SECRET: ${TEILEN_BLOB_LINK_SECRET}
      # Web Push (Phase 3). Leave unset to keep push silently disabled.
      TEILEN_VAPID_PUBLIC_KEY: ${TEILEN_VAPID_PUBLIC_KEY:-}
      TEILEN_VAPID_PRIVATE_KEY: ${TEILEN_VAPID_PRIVATE_KEY:-}
      TEILEN_VAPID_SUBJECT: ${TEILEN_VAPID_SUBJECT:-mailto:admin@teilen.app}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes: [blobs:/data/blobs]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["81:81", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes: { pgdata: , uploads: , caddy_data: , caddy_config: }
